# ========================================
# DevRats Test Configuration
# ========================================

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:devrats_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT config for tests
jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
jwt.expiration=3600000
jwt.refreshExpiration=604800000

# GitHub App test secrets
github.webhookSecret=test-webhook-secret
github.clientId=test-client-id
github.clientSecret=test-client-secret

# Disable mail sending in tests
spring.mail.host=localhost
spring.mail.port=25
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Disable scheduling in tests
spring.task.scheduling.pool.size=1
