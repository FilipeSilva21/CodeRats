name: DevRats
services:
  db:
    image: postgres:16-alpine
    container_name: devrats
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devrats123
      POSTGRES_DB: devrats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
